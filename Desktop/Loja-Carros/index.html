<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/estilo.css">
    <title>Site de comparação</title>
</head>
<body>
    <header>
        <h1>Nome<span>Loja</span> </h1>
        
    </header>
    <main class="container">
        <h2>Parâmetros de Entrada</h2>

        <section class="parametros-carros">
            <article class="card">
                <h4 id="kmh">KMH (carro 1) [50]</h4>
                <h5 id="carro-1">Carro 1:  <input type="number" min="0" max="50">
                <h5 id="consumo-1">Consumo (kwh/100km) [18]  <input type="number" min="0" max="18"></h5>

            </article>
            <article class="card">
                <h4 id="kmh">KMH (carro 2) [50]</h4>
                <h5 id="carro-2">Carro 2:  <input type="number" min="0" max="50">
                <h5 id="consumo-2">Consumo (kwh/100km) [18]  <input type="number" min="0" max="18"></h5>

            </article>
        </section>
    </main>
    
</body>
</html>
